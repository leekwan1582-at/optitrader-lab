<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OptiTrader Lab</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link href="stylesheet.css" rel="stylesheet">
</head>
<body>

<div id="app">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-bar-chart-fill"></i>
            OptiTrader Lab
        </span>

        <div>
            <button class="btn btn-outline-light btn-sm"
                onclick="showScreen('dashboard-screen')">
                Dashboard
            </button>

            <button class="btn btn-outline-light btn-sm"
                onclick="showScreen('experiment-screen')">
                New Experiment
            </button>

            <button class="btn btn-outline-light btn-sm"
                onclick="showScreen('datasets-screen')">
                Datasets
            </button>

            <button class="btn btn-outline-light btn-sm"
                onclick="showScreen('comparison-screen')">
                Compare
            </button>
        </div>
    </nav>

    <div class="container-fluid p-4">

        <!-- LOGIN -->

        <section id="login-screen">

            <div class="row justify-content-center">

                <div class="col-md-4">

                    <div class="card shadow">

                        <div class="card-body">

                            <h2>Welcome Back</h2>

                            <input
                                id="email"
                                class="form-control mb-3"
                                placeholder="Email">

                            <input
                                type="password"
                                id="password"
                                class="form-control mb-3"
                                placeholder="Password">

                            <button
                                class="btn btn-primary w-100"
                                onclick="login()">

                                Sign In

                            </button>

                        </div>
                    </div>

                </div>

            </div>

        </section>

        <!-- DASHBOARD -->

        <section id="dashboard-screen" class="d-none">

            <h2>Dashboard</h2>

            <div class="row mb-4">

                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body">
                            <h3 id="completedRuns">0</h3>
                            Completed Runs
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat-card">
                        <div class="card-body">
                            <h3 id="failedRuns">0</h3>
                            Failed Runs
                        </div>
                    </div>
                </div>

            </div>

            <div class="card">

                <div class="card-header">

                    Recent Experiments

                </div>

                <div class="table-responsive">

                    <table
                        class="table table-hover"
                        id="runsTable">

                    </table>

                </div>

            </div>

        </section>

        <!-- EXPERIMENT -->

        <section id="experiment-screen" class="d-none">

            <h2>New Experiment</h2>

            <div class="card">

                <div class="card-body">

                    <h4>
                        AI Optimization Assistant
                    </h4>

                    <textarea
                        id="prompt"
                        rows="4"
                        class="form-control mb-3">Optimize SMA crossover for max Sharpe with drawdown < 15%</textarea>

                    <button
                        class="btn btn-primary"
                        onclick="parsePrompt()">

                        Parse Parameters

                    </button>

                </div>

            </div>

        </section>

        <!-- DATASETS -->

        <section id="datasets-screen" class="d-none">

            <h2>Historical Datasets</h2>

            <div class="card">

                <div class="card-body">

                    <div class="border p-5 text-center">

                        <i class="bi bi-cloud-upload display-5"></i>

                        <p>
                            Drag CSV here
                        </p>

                    </div>

                </div>

            </div>

        </section>

        <!-- RESULTS -->

        <section id="results-screen" class="d-none">

            <h2>Results Analytics</h2>

            <div id="resultsContainer">

            </div>

        </section>

        <!-- COMPARISON -->

        <section id="comparison-screen" class="d-none">

            <h2>Experiment Comparison</h2>

            <div id="comparisonContainer">

            </div>

        </section>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="script.js"></script>

</body>
</html>
